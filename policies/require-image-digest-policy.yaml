apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-immutable-image-digests
spec:
  failurePolicy: Fail
  validationActions:
    - Deny
  webhookConfiguration:
    timeoutSeconds: 15
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: "request.object.spec.containers.all(c, c.image.contains('@sha256:'))"
      message: "Container images must use immutable @sha256 digest references; mutable tag-only references are prohibited."
