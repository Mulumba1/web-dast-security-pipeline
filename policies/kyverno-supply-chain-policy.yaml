apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: enforce-signed-and-attested-images
spec:
  validationActions:
    - Deny
  webhookConfiguration:
    timeoutSeconds: 30
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "*"
  attestors:
    - name: cosign_key
      cosign:
        key:
          data: |-
            -----BEGIN PUBLIC KEY-----
            MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEpjfvnd0d73mmWwgUEgZv8eZNPcYt
            VSjeGqoaeEm833rOuhXKGRJRrTCH1IdmwvN33wyL2CVZZc+sKeUuq+gKrg==
            -----END PUBLIC KEY-----
  attestations:
    - name: cyclonedx_sbom
      intoto:
        type: https://cyclonedx.org/bom
  validations:
    - expression: >-
        images.containers.all(image, !image.matches('^[^@]+:[^/@]+@sha256:'))
      message: "Container images must use immutable @sha256 digest references without mutable tags (e.g., repo@sha256:...)."
    - expression: >-
        images.containers.all(image,
          verifyImageSignatures(image, [attestors.cosign_key]) > 0 &&
          verifyAttestationSignatures(image, attestations.cyclonedx_sbom, [attestors.cosign_key]) > 0
        )
      message: "Container image must be signed by the authorized Cosign key and carry a valid CycloneDX SBOM attestation."
