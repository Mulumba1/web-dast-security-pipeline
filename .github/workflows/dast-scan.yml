name: Web Application DAST Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  dast-scan:
    name: OWASP ZAP and Nuclei DAST
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Prepare report directory
        run: |
          mkdir -p reports
          chmod -R 777 reports

      - name: Start Juice Shop test target
        run: |
          docker run -d --name juice-shop -p 3000:3000 bkimminich/juice-shop:latest
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ -o /dev/null; then
              echo "Juice Shop is ready."
              exit 0
            fi
            echo "Waiting for Juice Shop..."
            sleep 5
          done
          docker logs juice-shop || true
          exit 1

      - name: Run OWASP ZAP baseline scan
        id: zap_scan
        continue-on-error: true
        run: |
          docker run --rm \
            -u 0:0 \
            --network host \
            -v "$GITHUB_WORKSPACE/reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:3000 \
            -r zap-baseline.html \
            -J zap-baseline.json \
            -w zap-baseline.md \
            -I

      - name: Convert ZAP JSON to SARIF
        if: always()
        run: |
          if [ -s reports/zap-baseline.json ]; then
            python3 scripts/zap_to_sarif.py \
              reports/zap-baseline.json \
              reports/zap-baseline.sarif
          else
            echo "::warning::ZAP JSON report is missing or empty. Skipping SARIF conversion."
          fi

      - name: Install Nuclei
        if: always()
        run: |
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Update Nuclei templates
        if: always()
        run: nuclei -update-templates

      - name: Run Nuclei targeted scan
        id: nuclei_scan
        if: always()
        continue-on-error: true
        run: |
          nuclei \
            -u http://127.0.0.1:3000 \
            -tags cve,misconfig,exposure \
            -severity low,medium,high,critical \
            -jsonl-export reports/nuclei-results.jsonl \
            -sarif-export reports/nuclei.sarif

      - name: Summarize scan findings
        id: summarize_scan_findings
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          zap_path = Path("reports/zap-baseline.json")
          nuclei_path = Path("reports/nuclei-results.jsonl")

          zap_high = 0
          zap_critical = 0
          if zap_path.is_file() and zap_path.stat().st_size > 0:
              try:
                  zap_data = json.loads(zap_path.read_text())
                  sites = zap_data.get("site", []) if isinstance(zap_data, dict) else zap_data
                  if isinstance(sites, dict):
                      sites = [sites]
                  for site in sites:
                      if isinstance(site, dict):
                          for alert in site.get("alerts", []):
                              risk = str(alert.get("riskcode", "0"))
                              if risk == "3":
                                  zap_high += 1
                              elif risk == "4":
                                  zap_critical += 1
              except Exception as e:
                  print(f"Warning parsing ZAP JSON: {e}")

          nuclei_high = 0
          nuclei_critical = 0
          if nuclei_path.is_file() and nuclei_path.stat().st_size > 0:
              with nuclei_path.open() as stream:
                  for line in stream:
                      if not line.strip():
                          continue
                      try:
                          result = json.loads(line)
                          severity = str(result.get("info", {}).get("severity", "")).lower()
                          if severity == "high":
                              nuclei_high += 1
                          elif severity == "critical":
                              nuclei_critical += 1
                      except Exception:
                          pass

          summary = {
              "zap_high": zap_high,
              "zap_critical": zap_critical,
              "nuclei_high": nuclei_high,
              "nuclei_critical": nuclei_critical,
          }
          summary["total_high_critical"] = sum(summary.values())

          Path("reports/summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          with open("reports/summary.md", "w") as report:
              report.write("# DAST Scan Summary\n\n")
              for key, value in summary.items():
                  report.write(f"- **{key.replace('_', ' ').title()}:** {value}\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key, value in summary.items():
                  output.write(f"{key}={value}\n")

          print(json.dumps(summary, indent=2))
          PY

      - name: Upload ZAP SARIF to GitHub Code Scanning
        if: always() && hashFiles('reports/zap-baseline.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/zap-baseline.sarif
          category: zap-baseline

      - name: Upload Nuclei SARIF to GitHub Code Scanning
        if: always() && hashFiles('reports/nuclei.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/nuclei.sarif
          category: nuclei-scan

      - name: Save scan reports as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce HIGH and CRITICAL severity gate
        if: always()
        env:
          TOTAL_HIGH_CRITICAL: ${{ steps.summarize_scan_findings.outputs.total_high_critical }}
        run: |
          echo "HIGH/CRITICAL findings detected: ${TOTAL_HIGH_CRITICAL:-0}"
          if [ "${TOTAL_HIGH_CRITICAL:-0}" -gt 0 ]; then
            echo "::error::Security gate failed: HIGH/CRITICAL findings detected."
            exit 1
          fi
          echo "Security gate passed: no HIGH/CRITICAL findings detected."

      - name: Notify Slack Channel
        if: always() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        with:
          payload: |
            {
              "text": "DAST pipeline finished for ${{ github.repository }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Job status: ${{ job.status }}."
            }

      - name: Clean up test target
        if: always()
        run: docker rm -f juice-shop || true
