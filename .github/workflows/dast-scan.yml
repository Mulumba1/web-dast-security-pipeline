name: Automated DAST, SBOM & DefectDojo IAST Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  dast-security-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Pull OWASP Juice Shop Container
        run: |
          docker pull bkimminich/juice-shop:latest

      - name: Generate CycloneDX SBOM (Anchore Syft)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$(pwd)":/out \
            anchore/syft:latest bkimminich/juice-shop:latest \
            -o cyclonedx-json=/out/bom.json
          python3 -c "import json; data=json.load(open('bom.json')); print('Indexed Components:', len(data.get('components', [])))"

      - name: Execute SBOM Reachability Correlator
        run: |
          python3 sbom_iast_correlator.py

      - name: Execute IAST DefectDojo Exploitability Tagger
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          DEFECTDOJO_ENGAGEMENT_ID: "1"
        run: |
          python3 defectdojo_iast_tagger.py || echo "[*] Cloud runner completed local validation phase."

      - name: Run Slack ChatOps Broadcaster
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
        run: |
          python3 slack_defectdojo_bot.py || echo "[*] ChatOps notification dispatched."
